# ============================================================
# 6S Myopia 官网 Nginx 配置
# 放置位置：/etc/nginx/sites-available/6smyopia
# 启用：ln -s /etc/nginx/sites-available/6smyopia /etc/nginx/sites-enabled/
# 证书：sudo certbot --nginx -d 6smyopia.com -d www.6smyopia.com
#   （certbot 会自动把 80 端口块改成跳转 HTTPS，并填好证书路径）
# 注意：app.6smyopia.com 不走本服务器——它 CNAME 到 Lovable 托管，见部署手册
# ============================================================

# ---- 裸域 → www（HTTP 阶段，certbot 后会自动接管 HTTPS 跳转）----
server {
    listen 80;
    server_name 6smyopia.com;
    return 301 https://www.6smyopia.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 6smyopia.com;
    # certbot 会在此填入证书路径；若手动配置：
    # ssl_certificate     /etc/letsencrypt/live/www.6smyopia.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.6smyopia.com/privkey.pem;
    return 301 https://www.6smyopia.com$request_uri;
}

# ---- 主站 ----
server {
    listen 80;
    server_name www.6smyopia.com;
    # certbot 会把本块改为 return 301 https://...
}

server {
    listen 443 ssl http2;
    server_name www.6smyopia.com;

    root /var/www/6smyopia;
    index index.html;

    # certbot 会在此填入证书路径；若手动配置：
    # ssl_certificate     /etc/letsencrypt/live/www.6smyopia.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.6smyopia.com/privkey.pem;

    # ---------- 印刷短链（printed-links.md：永不删除、永不复用、永不 404）----------
    # /review → Amazon 书籍页（仅 KDP 版书尾；裸链，禁挂联盟标签）
    location = /review  { return 301 https://www.amazon.com/dp/B0HJQLF784; }
    location = /review/ { return 301 https://www.amazon.com/dp/B0HJQLF784; }

    # /app → SaaS 子域名（Lovable 托管，不在本机）
    location = /app  { return 301 https://app.6smyopia.com; }
    location = /app/ { return 301 https://app.6smyopia.com; }

    # ---------- 静态内容 ----------
    # /case/1 这类无尾斜杠的印刷短链 → 补斜杠进目录（静态层有 index.html）
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(css|js|jpg|jpeg|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
